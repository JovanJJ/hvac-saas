services:
  report-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    init: true
    restart: unless-stopped
    shm_size: 256mb
    mem_limit: 1g
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${REPORT_WORKER_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL}}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY}}}
      REPORT_WORKER_EMAIL: ${REPORT_WORKER_EMAIL}
      REPORT_WORKER_PASSWORD: ${REPORT_WORKER_PASSWORD}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
